<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Apply the theme before rendering to avoid a bright flash on dark devices.
      (() => {
        let theme;
        try { theme = JSON.parse(localStorage.getItem('form:theme')); } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0a0a' : '#fafafa';
      })();
    </script>
    <meta name="description" content="Your plan. Your pace. Track your four-day strength program, log every set, and build a stronger you with FORM." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FORM — Your training, with intention.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
